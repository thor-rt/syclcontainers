# Publish a tested image chain before moving stable tags. [AI-Codex]
name: Docker

on:
  workflow_dispatch:
  schedule:
    - cron: '29 18 * * 0'  # Every Sunday at 18:29 UTC
  push:
    branches:
      - main
    tags:
      - v*.*.*
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  workflow-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check publishing gates without registry writes
        run: |
          python3 -m venv /tmp/workflow-checks
          /tmp/workflow-checks/bin/pip install PyYAML==6.0.3
          /tmp/workflow-checks/bin/python -m unittest discover -s tests -p 'test_*.py' -v

  # Level 0: images with no in-repo image dependency.
  #   - adaptivecpp-toolchain : the shared LLVM/Clang/CMake build environment
  #   - intel-sycl-base       : Intel oneAPI base
  build-base:
    needs: workflow-checks
    runs-on: ${{ contains(matrix.path, 'intel') && fromJSON('{"group":"Default","labels":"ubuntu-75gb"}') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: adaptivecpp-toolchain
          - path: intel-sycl-base
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free disk space for Intel builds
        if: contains(matrix.path, 'intel')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.path }}
          tags: type=raw,value=${{ env.BUILD_TAG }}
          flavor: latest=false

      - name: Build Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        with:
          context: ./${{ matrix.path }}
          load: true
          tags: ${{ matrix.path }}:test
          cache-from: type=gha,scope=${{ matrix.path }}
          cache-to: type=gha,scope=${{ matrix.path }},mode=max
        if: github.event_name == 'pull_request'

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
        with:
          cosign-release: v2.2.4

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        id: push
        with:
          context: ./${{ matrix.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.path }}
          cache-to: type=gha,scope=${{ matrix.path }},mode=max

      - name: Run tests
        run: |
          if [ "$IMAGE_NAME" = "intel-sycl-base" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE/tests:/tests:ro" "$IMAGE_REF" \
              bash -c "source /opt/intel/oneapi/setvars.sh && /tests/run_tests.sh"
          elif [ "$IMAGE_NAME" = "adaptivecpp-toolchain" ]; then
            docker run --rm "$IMAGE_REF" bash -c "clang --version && cmake --version"
          fi
        env:
          IMAGE_REF: ${{ github.event_name == 'pull_request' && format('{0}:test', matrix.path) || format('{0}/{1}/{2}@{3}', env.REGISTRY, github.repository_owner, matrix.path, steps.push.outputs.digest) }}
          IMAGE_NAME: ${{ matrix.path }}

      - name: Sign the published Docker image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  # Level 1: adaptivecpp-runtime = toolchain + HPC libs (HDF5/OpenMPI/GMP/TBB).
  build-runtime:
    needs: build-base
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/adaptivecpp-runtime
          tags: type=raw,value=${{ env.BUILD_TAG }}
          flavor: latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        id: push
        with:
          context: ./adaptivecpp-runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TOOLCHAIN_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/adaptivecpp-toolchain:${{ env.BUILD_TAG }}
          cache-from: type=gha,scope=adaptivecpp-runtime
          cache-to: type=gha,scope=adaptivecpp-runtime,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
        with:
          cosign-release: v2.2.4

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  # Level 2: images built on toolchain (builder stage) + runtime (final stage),
  # plus intel-sycl-hpc on intel-sycl-base. adaptivecpp-hpc-multigpu carries
  # both the CUDA and ROCm backends, so it pulls both vendor sources at build
  # time (the largest job) — it runs on the ubuntu-75gb runner with disk prune.
  build-hpc:
    needs: build-runtime
    if: github.event_name != 'pull_request'
    runs-on: ${{ (matrix.large || contains(matrix.path, 'intel')) && fromJSON('{"group":"Default","labels":"ubuntu-75gb"}') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: adaptivecpp-base
            runtime: true
          - path: adaptivecpp-hpc-cuda
            runtime: true
            large: true
          - path: adaptivecpp-hpc-rocm
            runtime: true
            large: true
          - path: adaptivecpp-hpc-multigpu
            runtime: true
            large: true
          - path: intel-sycl-hpc
            base: intel-sycl-base
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free disk space for large/Intel builds
        if: matrix.large || contains(matrix.path, 'intel')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.path }}
          tags: type=raw,value=${{ env.BUILD_TAG }}
          flavor: latest=false

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
        with:
          cosign-release: v2.2.4

      - name: Push Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        id: push
        with:
          context: ./${{ matrix.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.base != '' && format('BASE_IMAGE={0}/{1}/{2}:{3}', env.REGISTRY, github.repository_owner, matrix.base, env.BUILD_TAG) || '' }}
            ${{ matrix.runtime && format('TOOLCHAIN_IMAGE={0}/{1}/adaptivecpp-toolchain:{2}', env.REGISTRY, github.repository_owner, env.BUILD_TAG) || '' }}
            ${{ matrix.runtime && format('RUNTIME_IMAGE={0}/{1}/adaptivecpp-runtime:{2}', env.REGISTRY, github.repository_owner, env.BUILD_TAG) || '' }}
          cache-from: type=gha,scope=${{ matrix.path }}
          cache-to: type=gha,scope=${{ matrix.path }},mode=max

      - name: Run tests
        run: |
          if [ "$IMAGE_NAME" = "intel-sycl-hpc" ]; then
            docker run --rm -v "$GITHUB_WORKSPACE/tests:/tests:ro" "$IMAGE_REF" \
              bash -c "source /opt/intel/oneapi/setvars.sh && /tests/run_tests.sh"
          else
            # AdaptiveCpp images: GHA runners have no GPU, so run_tests.sh
            # exercises the CPU backend (always present) via the acpp default device.
            docker run --rm -v "$GITHUB_WORKSPACE/tests:/tests:ro" "$IMAGE_REF" \
              bash -c "/tests/run_tests.sh"
          fi
        env:
          IMAGE_REF: ${{ format('{0}/{1}/{2}@{3}', env.REGISTRY, github.repository_owner, matrix.path, steps.push.outputs.digest) }}
          IMAGE_NAME: ${{ matrix.path }}

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  # Level 3: adaptivecpp-hpc thin alias of adaptivecpp-base (backward compat).
  build-alias:
    needs: build-hpc
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/adaptivecpp-hpc
          tags: type=raw,value=${{ env.BUILD_TAG }}
          flavor: latest=false

      - name: Build and push Docker image
        uses: docker/build-push-action@0565240e2d4ab88bba5387d719585280857ece09
        id: push
        with:
          context: ./adaptivecpp-hpc
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/adaptivecpp-base:${{ env.BUILD_TAG }}
          cache-from: type=gha,scope=adaptivecpp-hpc
          cache-to: type=gha,scope=adaptivecpp-hpc,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@59acb6260d9c0ba8f4a2f9d9b48431a222b68e20
        with:
          cosign-release: v2.2.4

      - name: Sign the published Docker image
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for tag in ${TAGS}; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

  promote:
    needs:
      - build-base
      - build-runtime
      - build-hpc
      - build-alias
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - adaptivecpp-toolchain
          - adaptivecpp-runtime
          - adaptivecpp-base
          - adaptivecpp-hpc
          - adaptivecpp-hpc-cuda
          - adaptivecpp-hpc-rocm
          - adaptivecpp-hpc-multigpu
          - intel-sycl-base
          - intel-sycl-hpc

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f95db51fddba0c2d1ec667646a06c2ce06100226

      - name: Log into registry
        uses: docker/login-action@343f7c4344506bcbf9b4de18042ae17996df046d
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select stable tags
        id: meta
        uses: docker/metadata-action@96383f45573cb7f253c731d3b3ab81c87ef81934
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=clang19,enable=${{ github.ref == 'refs/heads/main' && startsWith(matrix.image, 'adaptivecpp-') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Promote tested image without rebuilding
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # Resolve once; every alias must retain the tested, signed digest. [AI-Codex]
          digest=$(docker buildx imagetools inspect "$IMAGE:$BUILD_TAG" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          args=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] || args+=(--tag "$tag")
          done <<< "$TAGS"
          ((${#args[@]} > 0))
          docker buildx imagetools create --prefer-index=false "${args[@]}" "$IMAGE@$digest"

  cleanup:
    # Run after failed builds too; never overlap a publisher. [AI-Codex]
    needs: [workflow-checks, build-base, build-runtime, build-hpc, build-alias, promote]
    if: always() && !cancelled() && needs.workflow-checks.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Retain rollback builds and remove expired build versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/retain_container_builds.py --repository "$RETENTION_REPOSITORY" --apply
